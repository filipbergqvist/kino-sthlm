name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Free on public repositories: GitHub Actions has no minute limit for public repos.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # Offline tests only: fixture parsing, matching, CSV import.
      # The live-site canaries run on their own schedule (see canary.yml).
      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kinosthlm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
